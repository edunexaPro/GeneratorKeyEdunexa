<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Keygen EDUNEXA (Smart Extract)</title>
    
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Keygen Edunexa">
    <link rel="apple-touch-icon" href="https://i.ibb.co/YSHKvYQ/Chat-GPT-Image-5-Jun-2026-22-30-27.png">
    <link rel="manifest" href="data:application/manifest+json,%7B%22name%22%3A%22Keygen%20Edunexa%22%2C%22short_name%22%3A%22Keygen%22%2C%22start_url%22%3A%22.%22%2C%22display%22%3A%22standalone%22%2C%22background_color%22%3A%22%23f0f2f5%22%2C%22theme_color%22%3A%22%23007bff%22%2C%22icons%22%3A%5B%7B%22src%22%3A%22https%3A%2F%2Fi.ibb.co%2FYSHKvYQ%2FChat-GPT-Image-5-Jun-2026-22-30-27.png%22%2C%22sizes%22%3A%22512x512%22%2C%22type%22%3A%22image%2Fpng%22%7D%5D%7D">

    <style>
        body { font-family: sans-serif; background: #f0f2f5; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; padding: 10px; }
        .card { background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); width: 100%; max-width: 350px; text-align: center; }
        input { width: 100%; padding: 12px; margin-bottom: 10px; border: 1px solid #ccc; border-radius: 8px; box-sizing: border-box; font-size: 14px; text-align: center; }
        .result { background: #e7f3ff; padding: 12px; border-radius: 8px; font-weight: bold; font-size: 1.2rem; color: #007bff; border: 1px solid #cce5ff; margin-bottom: 5px; }
        .btn-wa { background: #25D366; color: white; border: none; padding: 18px; width: 100%; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 16px; margin-top: 10px; }
        .hint { font-size: 11px; color: #666; margin-bottom: 15px; }
    </style>
</head>
<body>

<div class="card">
    <a href="https://ibb.co/YSHKvYQ" target="_blank">
        <img src="https://i.ibb.co/YSHKvYQ/Chat-GPT-Image-5-Jun-2026-22-30-27.png" alt="Logo Edunexa" style="width: 80px; height: 80px; object-fit: contain; margin-bottom: 10px; border: 0;">
    </a>
    
    <h3 style="margin-top: 5px;">EDUNEXA KEYGEN</h3>
    <p class="hint">Bisa langsung paste pesan lengkap!</p>
    
    <input type="text" id="id1" placeholder="PASTE PESAN UTAMA" oninput="updateAll()">
    <div class="result" id="res1">-</div>

    <input type="text" id="id2" placeholder="PASTE PESAN INPUT" oninput="updateAll()">
    <div class="result" id="res2">-</div>

    <button class="btn-wa" onclick="kirimWA()">Kirim WA</button>
</div>

<script>
    // --- PENDAFTARAN SERVICE WORKER VIRTUAL UNTUK INSTALASI ---
    if ('serviceWorker' in navigator) {
        const swCode = `self.addEventListener('fetch', function(e) {});`;
        const blob = new Blob([swCode], {type: 'application/javascript'});
        const swUrl = URL.createObjectURL(blob);
        navigator.serviceWorker.register(swUrl).catch(function(err) {
            console.log('Service Worker registration failed: ', err);
        });
    }

    // --- LOGIKA UTAMA KEYGEN ---
    const SALT = 1205; 
    const PREFIX = "EDU";
    const SUFFIX = "FTY";

    function extractId(text) {
        if (!text) return "";
        const match = text.match(/DX-[A-Z0-9]+/i);
        return match ? match[0] : text; 
    }

    function calculate(rawInput, prefix) {
        let cleanId = extractId(rawInput).replace(/\s/g, '').toUpperCase();
        if (cleanId.length === 0) return "-";
        
        let totalASCII = 0;
        for (let i = 0; i < cleanId.length; i++) {
            totalASCII += cleanId.charCodeAt(i);
        }
        return prefix + (totalASCII * SALT) + SUFFIX;
    }

    function updateAll() {
        document.getElementById('res1').innerText = calculate(document.getElementById('id1').value, "EDU");
        document.getElementById('res2').innerText = calculate(document.getElementById('id2').value, "INP");
    }

    function kirimWA() {
        let key1 = document.getElementById('res1').innerText;
        let key2 = document.getElementById('res2').innerText;
        
        if (key1 === "-" && key2 === "-") {
            alert("Isi minimal salah satu ID dulu!");
            return;
        }

        let pesan = "Halo, berikut Kode Aktivasi EDUNEXA Anda:\n\n";
        if (key1 !== "-") pesan += "Kode Utama: " + key1 + "\n";
        if (key2 !== "-") pesan += "Kode Input: " + key2 + "\n";
        
        window.location.href = "whatsapp://send?text=" + encodeURIComponent(pesan);
    }
</script>

</body>
</html>
